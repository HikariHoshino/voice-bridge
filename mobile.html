<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>声桥</title>
  <link rel="icon" type="image/png" href="data:image/png;base64,{{APP_ICON_BASE64}}">
  <script>
    (() => {
      let preference = 'system';
      try {
        preference = localStorage.getItem('voiceBridgeTheme') || 'system';
      } catch (_) {}
      const dark = preference === 'dark'
        || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.themePreference = preference;
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei UI", "Segoe UI", sans-serif;
      --bg: #E8ECF1; --ink: #1F2937; --muted: #5B6573; --icon: #3B4452;
      --hi: #FFFFFF; --lo: #C5CCD6; --lo-in: #C9D0DA;
      --accent: #2F5BEA; --ring: #2F5BEA59; --ok: #166534; --ok-dot: #16A34A;
      --confirm: #C2410C;
      --spring: cubic-bezier(.34,1.35,.64,1);
      --raised: 6px 6px 14px var(--lo), -6px -6px 14px var(--hi);
      --raised-sm: 4px 4px 10px var(--lo), -4px -4px 10px var(--hi);
      --inset: inset 2px 2px 5px var(--lo-in), inset -2px -2px 5px var(--hi);
      --inset-lg: inset 4px 4px 9px var(--lo-in), inset -4px -4px 9px var(--hi);
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1E232B; --ink: #E6EAF0; --muted: #9AA4B2; --icon: #C8D0DB;
      --hi: #2A313B; --lo: #13161B; --lo-in: #13161B;
      --accent: #3D66F0; --ring: #8FA8FF66; --ok: #6EE7A0; --ok-dot: #4ADE80;
      --confirm: #EA580C;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
      color: var(--ink);
      background: var(--bg);
    }
    /* Theme crossfade: surfaces ease their colours and shadows instead of jumping. */
    body, body *, body *::before, body *::after {
      transition: background-color .28s ease, color .28s ease, box-shadow .28s ease, border-color .28s ease;
    }
    main { width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand { display: flex; min-width: 0; align-items: center; gap: 10px; }
    .mark { width: 44px; height: 44px; flex: 0 0 auto; border-radius: 14px; box-shadow: var(--raised-sm); }
    h1 { margin: 0; font-size: 20px; line-height: 1.25; }
    .tagline { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .header-actions { position: relative; display: flex; flex: 0 0 auto; align-items: center; gap: 10px; }
    .settings-control { position: static; }   /* anchor the popover to the header edge, not the gear */
    button { border: 0; font: inherit; color: inherit; background: var(--bg); -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .header-icon-button {
      display: grid; width: 44px; height: 44px; padding: 0; place-items: center;
      border-radius: 50%; color: var(--icon); box-shadow: var(--raised-sm);
    }
    .header-icon-button svg, .pill-button svg {
      width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .header-icon-button[aria-expanded="true"] { box-shadow: var(--inset); }
    .settings-popover {
      position: absolute; z-index: 5; top: calc(100% + 12px); right: 0;
      width: min(285px, calc(100vw - 28px)); padding: 14px 16px;
      border-radius: 18px; color: var(--ink); background: var(--bg); box-shadow: var(--raised);
    }
    .settings-popover[hidden] { display: none; }
    .settings-title { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
    .switch-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 44px; font-size: 15px; }
    .switch-row input {
      width: 46px; height: 26px; flex: 0 0 auto; margin: 0; padding: 3px; appearance: none;
      border-radius: 13px; background: var(--bg); box-shadow: var(--inset);
    }
    .switch-row input::after {
      display: block; width: 20px; height: 20px; border-radius: 50%; content: "";
      background: var(--bg); box-shadow: 2px 2px 4px var(--lo), -1px -1px 3px var(--hi);
      transition: transform .32s var(--spring), background-color .28s ease, box-shadow .28s ease;
    }
    .switch-row input:checked { background: var(--accent); box-shadow: inset 2px 2px 4px #00000047; }
    .switch-row input:checked::after { transform: translateX(20px); background: #FFFFFF; box-shadow: 1px 1px 3px #0000004d; }
    .switch-row input:focus-visible, button:focus-visible, #theme:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px; }
    .theme-control { position: relative; flex: 0 0 auto; }
    .theme-control::after {
      position: absolute; top: 50%; right: 14px; content: "⌄"; color: var(--muted); pointer-events: none; transform: translateY(-58%);
    }
    #theme {
      min-height: 44px; padding: 0 32px 0 16px; border: 0; border-radius: 22px; outline: none; appearance: none;
      color: var(--icon); background: var(--bg); box-shadow: var(--raised-sm); font: inherit; font-size: 14px;
    }
    #status {
      align-self: flex-start; display: inline-flex; align-items: center; margin: 0; min-height: 34px; padding: 0 14px;
      border-radius: 17px; color: var(--ok); background: var(--bg); box-shadow: var(--inset); font-size: 14px;
    }
    .card {
      flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0;
      padding: 14px; border-radius: 22px; background: var(--bg); box-shadow: var(--raised);
    }
    .field-label { display: block; padding-left: 2px; font-size: 15px; font-weight: 600; }
    /* The editor takes whatever height the phone has left. */
    textarea {
      flex: 1; width: 100%; min-height: 160px; padding: 14px; border: 0; border-radius: 16px; outline: none; resize: none;
      color: var(--ink); background: var(--bg); box-shadow: var(--inset-lg);
      font: inherit; font-size: 17px; line-height: 1.65;
    }
    textarea:focus { box-shadow: var(--inset-lg), 0 0 0 2px var(--ring); }
    textarea::placeholder { color: var(--muted); }
    .hint { margin: 0; padding: 0 2px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .action-panel { display: flex; flex-direction: column; gap: 12px; padding-top: 4px; }
    .primary-actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    .primary-button {
      min-height: 54px; padding: 0 12px; border-radius: 27px; font-size: 16px; font-weight: 600; box-shadow: var(--raised-sm);
    }
    #send { color: #FFFFFF; background: var(--accent); }
    #enter { color: var(--ink); }
    #send.confirming, #enter.confirming { color: #FFFFFF; background: var(--confirm); }
    .secondary-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .pill-button {
      display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 50px; padding: 0 8px;
      border-radius: 25px; color: var(--icon); box-shadow: var(--raised-sm); font-size: 15px;
    }
    /* Pressing sinks the control into the surface. */
    button:active, button.is-pressed { box-shadow: var(--inset); }
    #send:active, #send.is-pressed, .confirming:active, .confirming.is-pressed { box-shadow: inset 2px 2px 5px #00000047; }
    button:disabled { opacity: .5; box-shadow: var(--inset); }
    #message { min-height: 22px; color: var(--muted); text-align: center; font-size: 14px; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden;
      clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
    }
    @media (max-width: 390px) {
      body { padding-right: 12px; padding-left: 12px; }
      .card { padding: 12px; }
      .primary-button { padding: 0 8px; font-size: 15px; }
      .pill-button { font-size: 14px; gap: 4px; }
      .theme-control::after { right: 12px; }
      #theme { width: 96px; padding-right: 26px; padding-left: 12px; }
      .header-actions { gap: 8px; }
      .tagline { font-size: 12px; white-space: nowrap; }
    }
    @media (max-height: 640px) { textarea { min-height: 110px; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand">
        <img class="mark" src="data:image/png;base64,{{APP_ICON_BASE64}}" alt="声桥">
        <div>
          <h1>声桥</h1>
          <p class="tagline">用手机说，在电脑上写</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="settings-control">
          <button class="header-icon-button" id="settings-toggle" type="button"
                  aria-label="操作设置" aria-expanded="false" aria-controls="mobile-settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"/>
            </svg>
          </button>
          <div class="settings-popover" id="mobile-settings" hidden>
            <p class="settings-title">操作确认</p>
            <label class="switch-row">
              <span>按下回车二次确认</span>
              <input id="confirm-enter" type="checkbox">
            </label>
            <label class="switch-row">
              <span>发送到电脑二次确认</span>
              <input id="confirm-send" type="checkbox">
            </label>
          </div>
        </div>
        <label class="theme-control">
          <span class="sr-only">页面外观</span>
          <select id="theme" aria-label="页面外观">
            <option value="system">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </label>
      </div>
    </header>

    <p id="status">● 正在连接电脑</p>

    <section class="card">
      <label class="field-label" for="text">双向文字区</label>
      <textarea id="text" autofocus placeholder="点击这里，再点击手机输入法上的麦克风说话……"></textarea>
      <p class="hint">电脑发来的文字会插入当前光标。清空或发送后均可在本页撤销，不会影响电脑端。</p>

      <div class="action-panel">
        <div class="primary-actions">
          <button class="primary-button" id="send" type="button" aria-pressed="false">
            <span id="send-label">发送到电脑</span>
          </button>
          <button class="primary-button" id="enter" type="button" aria-pressed="false">
            <span id="enter-label">按下回车</span>
          </button>
        </div>

        <div class="secondary-actions">
          <button class="pill-button" id="clear" type="button" aria-label="清空" title="清空">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/>
              </svg>
              <span>清空</span>
            </button>
          <button class="pill-button" id="undo" type="button" aria-label="撤销" title="撤销" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M9 7 4 12l5 5M5 12h8a6 6 0 0 1 6 6"/>
              </svg>
              <span>撤销</span>
            </button>
          <button class="pill-button" id="copy" type="button" aria-label="复制" title="复制">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="8" y="8" width="11" height="11" rx="2"/>
                <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>
              </svg>
              <span>复制</span>
            </button>
        </div>
      </div>

      <div id="message" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const text = document.getElementById('text');
    const send = document.getElementById('send');
    const sendLabel = document.getElementById('send-label');
    const enter = document.getElementById('enter');
    const enterLabel = document.getElementById('enter-label');
    const undo = document.getElementById('undo');
    const message = document.getElementById('message');
    const status = document.getElementById('status');
    const theme = document.getElementById('theme');
    const settingsToggle = document.getElementById('settings-toggle');
    const settingsPopover = document.getElementById('mobile-settings');
    const confirmEnter = document.getElementById('confirm-enter');
    const confirmSend = document.getElementById('confirm-send');
    const systemTheme = matchMedia('(prefers-color-scheme: dark)');
    const queryToken = new URLSearchParams(location.search).get('token') || '';
    if (queryToken) localStorage.setItem('voiceBridgeToken', queryToken);
    const token = queryToken || localStorage.getItem('voiceBridgeToken') || '';
    const stateKey = 'voiceBridgeReceiveState-' + token;
    let receiveState = { session: '', after: 0 };
    let clearedSnapshot = null;
    let confirmationSettings = { confirm_enter: true, confirm_send: false };
    let sendConfirmationTimer = null;
    let enterConfirmationTimer = null;

    try {
      receiveState = JSON.parse(localStorage.getItem(stateKey)) || receiveState;
    } catch (_) {}

    function applyTheme(preference) {
      const dark = preference === 'dark'
        || (preference === 'system' && systemTheme.matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.themePreference = preference;
    }

    theme.value = document.documentElement.dataset.themePreference || 'system';
    theme.addEventListener('change', () => {
      try {
        localStorage.setItem('voiceBridgeTheme', theme.value);
      } catch (_) {}
      applyTheme(theme.value);
    });
    const handleSystemTheme = () => {
      if (theme.value === 'system') applyTheme('system');
    };
    if (systemTheme.addEventListener) {
      systemTheme.addEventListener('change', handleSystemTheme);
    } else {
      systemTheme.addListener(handleSystemTheme);
    }

    function applyConfirmationSettings(settings) {
      confirmationSettings = {
        confirm_enter: settings.confirm_enter !== false,
        confirm_send: settings.confirm_send === true
      };
      confirmEnter.checked = confirmationSettings.confirm_enter;
      confirmSend.checked = confirmationSettings.confirm_send;
      if (!confirmationSettings.confirm_enter) resetEnterConfirmation();
      if (!confirmationSettings.confirm_send) resetSendConfirmation();
    }

    async function loadConfirmationSettings() {
      try {
        const response = await fetch('/settings?token=' + encodeURIComponent(token), {
          cache: 'no-store'
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '读取设置失败');
        applyConfirmationSettings(result);
      } catch (error) {
        message.textContent = error.message;
      }
    }

    async function saveConfirmationSetting(key, value, control) {
      control.disabled = true;
      try {
        const response = await fetch('/settings?token=' + encodeURIComponent(token), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ [key]: value })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '保存设置失败');
        applyConfirmationSettings(result);
        message.textContent = '设置已保存到电脑';
      } catch (error) {
        control.checked = !value;
        message.textContent = error.message;
      } finally {
        control.disabled = false;
      }
    }

    settingsToggle.addEventListener('click', event => {
      event.stopPropagation();
      const opening = settingsPopover.hidden;
      settingsPopover.hidden = !opening;
      settingsToggle.setAttribute('aria-expanded', String(opening));
    });
    settingsPopover.addEventListener('click', event => event.stopPropagation());
    document.addEventListener('click', () => {
      settingsPopover.hidden = true;
      settingsToggle.setAttribute('aria-expanded', 'false');
    });
    confirmEnter.addEventListener('change', () => {
      saveConfirmationSetting('confirm_enter', confirmEnter.checked, confirmEnter);
    });
    confirmSend.addEventListener('change', () => {
      saveConfirmationSetting('confirm_send', confirmSend.checked, confirmSend);
    });

    document.querySelectorAll('button').forEach(button => {
      const release = () => setTimeout(() => button.classList.remove('is-pressed'), 55);
      button.addEventListener('pointerdown', () => {
        if (!button.disabled) button.classList.add('is-pressed');
      });
      button.addEventListener('pointerup', release);
      button.addEventListener('pointercancel', release);
      button.addEventListener('pointerleave', release);
    });

    function resetSendConfirmation() {
      clearTimeout(sendConfirmationTimer);
      sendConfirmationTimer = null;
      send.classList.remove('confirming');
      send.setAttribute('aria-pressed', 'false');
      sendLabel.textContent = '发送到电脑';
    }

    function resetEnterConfirmation() {
      clearTimeout(enterConfirmationTimer);
      enterConfirmationTimer = null;
      enter.classList.remove('confirming');
      enter.setAttribute('aria-pressed', 'false');
      enterLabel.textContent = '按下回车';
    }

    document.getElementById('clear').addEventListener('click', () => {
      resetSendConfirmation();
      resetEnterConfirmation();
      if (!text.value) {
        message.textContent = '文字区已经是空的';
        return;
      }
      clearedSnapshot = {
        value: text.value,
        start: text.selectionStart ?? text.value.length,
        end: text.selectionEnd ?? text.value.length
      };
      text.value = '';
      undo.disabled = false;
      message.textContent = '已清空，可撤销';
      text.focus();
    });

    undo.addEventListener('click', () => {
      resetSendConfirmation();
      resetEnterConfirmation();
      if (!clearedSnapshot) return;
      text.value = clearedSnapshot.value;
      text.focus();
      text.setSelectionRange(clearedSnapshot.start, clearedSnapshot.end);
      clearedSnapshot = null;
      undo.disabled = true;
      message.textContent = '已撤销清空';
    });

    text.addEventListener('input', () => {
      resetSendConfirmation();
      resetEnterConfirmation();
      if (clearedSnapshot && text.value) {
        clearedSnapshot = null;
        undo.disabled = true;
      }
    });

    document.getElementById('copy').addEventListener('click', async () => {
      resetSendConfirmation();
      resetEnterConfirmation();
      if (!text.value) {
        message.textContent = '没有可以复制的文字';
        return;
      }
      try {
        await navigator.clipboard.writeText(text.value);
      } catch (_) {
        text.focus();
        text.select();
        document.execCommand('copy');
      }
      message.textContent = '已复制，可粘贴到其他手机应用';
    });

    send.addEventListener('click', async () => {
      resetEnterConfirmation();
      if (!text.value) {
        resetSendConfirmation();
        message.textContent = '请先输入文字';
        text.focus();
        return;
      }
      if (confirmationSettings.confirm_send && !send.classList.contains('confirming')) {
        send.classList.add('confirming');
        send.setAttribute('aria-pressed', 'true');
        sendLabel.textContent = '确认吗？';
        message.textContent = '再次点击才会发送到电脑';
        sendConfirmationTimer = setTimeout(resetSendConfirmation, 4500);
        return;
      }

      clearTimeout(sendConfirmationTimer);
      const sentSnapshot = {
        value: text.value,
        start: text.selectionStart ?? text.value.length,
        end: text.selectionEnd ?? text.value.length
      };
      send.disabled = true;
      message.textContent = '正在发送……';
      try {
        const response = await fetch('/send?token=' + encodeURIComponent(token), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: text.value })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '发送失败');
        text.value = '';
        clearedSnapshot = sentSnapshot;
        undo.disabled = false;
        message.textContent = '已发送；电脑未收到时可点撤销恢复';
        text.blur();
      } catch (error) {
        message.textContent = error.message;
      } finally {
        send.disabled = false;
        resetSendConfirmation();
      }
    });

    enter.addEventListener('click', async () => {
      resetSendConfirmation();
      if (confirmationSettings.confirm_enter && !enter.classList.contains('confirming')) {
        enter.classList.add('confirming');
        enter.setAttribute('aria-pressed', 'true');
        enterLabel.textContent = '确认吗？';
        message.textContent = '再次点击才会在电脑按下回车';
        enterConfirmationTimer = setTimeout(resetEnterConfirmation, 4500);
        return;
      }

      clearTimeout(enterConfirmationTimer);
      enter.disabled = true;
      message.textContent = '正在按下回车……';
      try {
        const response = await fetch('/enter?token=' + encodeURIComponent(token), {
          method: 'POST'
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '回车发送失败');
        message.textContent = '已在电脑按下回车';
      } catch (error) {
        message.textContent = error.message;
      } finally {
        enter.disabled = false;
        resetEnterConfirmation();
      }
    });

    function insertAtCursor(value) {
      const start = text.selectionStart ?? text.value.length;
      const end = text.selectionEnd ?? start;
      text.setRangeText(value, start, end, 'end');
      text.dispatchEvent(new Event('input', { bubbles: true }));
      if (document.visibilityState === 'visible') text.focus();
    }

    function saveReceiveState() {
      try {
        localStorage.setItem(stateKey, JSON.stringify(receiveState));
      } catch (_) {}
    }

    async function acknowledgeReceived() {
      if (!receiveState.session || !receiveState.after) return;
      const response = await fetch('/ack?token=' + encodeURIComponent(token), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          session: receiveState.session,
          through: receiveState.after
        })
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || '确认接收失败');
    }

    const delay = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));

    async function receiveLoop() {
      while (true) {
        try {
          await acknowledgeReceived();
          const params = new URLSearchParams({
            token,
            after: String(receiveState.after || 0),
            session: receiveState.session || ''
          });
          const response = await fetch('/receive?' + params.toString(), { cache: 'no-store' });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || '连接失败');

          status.textContent = '● 已连接到电脑';
          if (result.session !== receiveState.session) {
            receiveState = { session: result.session, after: 0 };
            saveReceiveState();
          }
          for (const item of result.messages) {
            insertAtCursor(item.text);
            receiveState.after = item.id;
            saveReceiveState();
            message.textContent = '电脑文字已插入';
          }
          receiveState.session = result.session;
          saveReceiveState();
        } catch (error) {
          status.textContent = '● 连接已断开，正在重试';
          await delay(1500);
        }
      }
    }

    loadConfirmationSettings();
    receiveLoop();
  </script>
</body>
</html>
